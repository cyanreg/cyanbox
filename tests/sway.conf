# The private headless compositor the interface is tested on. Start with
#   WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway -c tests/sway.conf -d
# and read the wayland display name from its log. See docs/HACKING.md.
output HEADLESS-1 resolution 1920x1080 position 0,0 bg #202020 solid_color
default_border none
focus_follows_mouse no
seat * hide_cursor 0
for_window [app_id="cyanbox"] fullscreen enable
